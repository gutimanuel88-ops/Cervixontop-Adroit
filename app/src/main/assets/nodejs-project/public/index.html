<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CervixOnTop Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial}header{padding:18px;background:#100000;border-bottom:1px solid #700}.logo{font-size:25px;font-weight:900;color:#f22}main{max-width:850px;margin:auto;padding:14px}button,input,select{font:inherit;border-radius:10px;padding:12px}button{border:0;font-weight:800;background:#b00;color:#fff}button.dark{background:#181818;border:1px solid #333}.row{display:flex;gap:8px;flex-wrap:wrap}.card,.box{background:#101010;border:1px solid #292929;border-radius:14px;padding:14px;margin:10px 0}.name{font-size:19px;font-weight:900}.badge{display:inline-block;background:#222;border-radius:20px;padding:5px 8px;font-size:11px;margin:5px 3px 0 0}.online{color:#5f5}.logs{background:#070707;padding:10px;border-radius:10px;max-height:420px;overflow:auto;font:12px monospace}.log{padding:6px;border-bottom:1px solid #151515;white-space:pre-wrap;word-break:break-word}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:min(500px,100%)}label{display:block;color:#aaa;font-size:12px;margin:10px 0 5px}input,select{width:100%;background:#080808;color:#fff;border:1px solid #333}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}</style><header><div class="logo">CervixOnTop</div><small>Mobile • Minecraft Bot Manager</small></header><main><div class="row"><button onclick="openM()">＋ AGREGAR CUENTA</button><button class="dark" onclick="post('/api/disconnect-all',{})">DETENER TODO</button><button class="dark" onclick="refresh()">↻</button></div><h2>Cuentas</h2><div id="list"></div><div id="logsec" style="display:none"><div class="row" style="justify-content:space-between"><h2 id="lt"></h2><button class="dark" onclick="closeL()">Cerrar</button></div><div id="logs" class="logs"></div></div></main><div id="modal" class="modal"><div class="box"><h2>Agregar cuenta</h2><label>Usuario</label><input id="u"><label>Contraseña</label><input id="p" type="password"><label>Código 2FA — OPCIONAL</label><input id="t"><label>Modo</label><select id="m"><option value="afk">💤 SOLO AFK</option><option value="mineria">⛏️ MINERÍA</option></select><label class="check"><input id="v" type="checkbox"> Ejecutar /v al entrar a Skyblock</label><div class="row"><button onclick="saveA()">Guardar</button><button class="dark" onclick="closeM()">Cancelar</button></div></div></div><script>let selected='';async function api(u,o){let r=await fetch(u,o);return r.json()}async function post(u,d){let r=await api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)alert(r.error||'Error');refresh()}async function refresh(){let d=await api('/api/accounts'),run={};d.running.forEach(x=>run[x.usuario]=x);document.getElementById('list').innerHTML=d.accounts.length?d.accounts.map(a=>`<div class="card"><div class="name">${e(a.usuario)}</div><span class="badge">${a.modo==='mineria'?'⛏️ MINERÍA':'💤 SOLO AFK'}</span><span class="badge">${a.vanish?'👻 VANISH':'👤 VANISH OFF'}</span><div>${run[a.usuario]?'<span class="online">● CONECTADO</span>':'● DETENIDO'}</div><div class="row" style="margin-top:10px"><button class="dark" onclick="logs('${x(a.usuario)}')">LOGS</button>${run[a.usuario]?`<button onclick="post('/api/disconnect',{usuario:'${x(a.usuario)}'})">DETENER</button>`:`<button onclick="post('/api/connect',{usuario:'${x(a.usuario)}'})">CONECTAR</button>`}<button class="dark" onclick="delA('${x(a.usuario)}')">ELIMINAR</button></div></div>`).join(''):'<div class="card">No hay cuentas guardadas.</div>';if(selected)logs(selected)}async function saveA(){let d={usuario:u.value.trim(),password:p.value,codigo2fa:t.value.trim(),modo:m.value,vanish:v.checked};let r=await api('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)return alert(r.error);closeM();refresh()}async function delA(user){if(confirm('¿Eliminar cuenta?')){await fetch('/api/accounts/'+encodeURIComponent(user),{method:'DELETE'});if(selected===user)closeL();refresh()}}async function logs(user){selected=user;document.getElementById('logsec').style.display='block';lt.textContent='Logs • '+user;let d=await api('/api/logs?usuario='+encodeURIComponent(user));document.getElementById('logs').innerHTML=d.logs.map(z=>`<div class="log">${new Date(z.timestamp).toLocaleTimeString()} ${e(z.mensaje)}</div>`).join('');document.getElementById('logs').scrollTop=999999}function closeL(){selected='';logsec.style.display='none'}function openM(){modal.classList.add('show')}function closeM(){modal.classList.remove('show')}function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function x(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}new EventSource('/events').onmessage=()=>refresh();refresh()</script></html>
