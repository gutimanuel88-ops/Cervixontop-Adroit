name: Build CervixOnTop APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Download Node.js Mobile ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libnode/bin/arm64-v8a app/libnode/include/node
          curl -fL --retry 3 -o nodejs-mobile-android.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          rm -rf _node_runtime
          mkdir _node_runtime
          unzip -q nodejs-mobile-android.zip -d _node_runtime
          test -f _node_runtime/bin/arm64-v8a/libnode.so
          cp _node_runtime/bin/arm64-v8a/libnode.so app/libnode/bin/arm64-v8a/libnode.so
          cp -R _node_runtime/include/node/. app/libnode/include/node/

      - name: Install Mineflayer dependencies
        working-directory: app/src/main/assets/nodejs-project
        run: |
          npm install --omit=dev --package-lock=false
          rm -rf node_modules/prismarine-nbt/sample
          rm -rf node_modules/prismarine-nbt/sample

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CervixOnTop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
